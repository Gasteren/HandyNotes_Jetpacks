name: Upload to CurseForge

on:
  push:
    branches:
      - main

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create zip
        run: |
          mkdir HandyNotes_Jetpacks
          cp *.lua *.toc HandyNotes_Jetpacks/
          zip -r HandyNotes_Jetpacks.zip HandyNotes_Jetpacks

      # The commit message becomes the CurseForge changelog, without the Co-authored-by line.
      - name: Changelog from the commit message
        id: changelog
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          text=$(printf '%s\n' "$MESSAGE" | grep -viE '^(co-authored-by|signed-off-by):' || true)
          if [ -z "$text" ]; then
            text="Manual release"
          fi
          printf '%s\n' "$text"
          {
            echo "text<<CHANGELOG_EOF"
            printf '%s\n' "$text"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload to CurseForge
        uses: itsmeow/curseforge-upload@13f278adc4cc7b881555f87e6ea528387dd6492b # v3 (v3.1.0)
        with:
          token: "${{ secrets.HANDYNOTES_JETPACKS }}"
          project_id: "326989"
          game_endpoint: "wow"
          file_path: "HandyNotes_Jetpacks.zip"
          game_versions: "12.1.5"
          release_type: "release"
          display_name: "HandyNotes_Jetpacks - ${{ github.event.head_commit.timestamp }}"
          changelog: "${{ steps.changelog.outputs.text }}"
          changelog_type: "markdown"